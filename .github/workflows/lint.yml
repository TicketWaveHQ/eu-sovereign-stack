name: lint

# Keeps the list trustworthy in CI:
#  - Markdown link check catches dead links and dead in-page anchors
#    (a broken backlink is a broken promise).
#  - House-style check enforces "no em-dashes" in everything a reader sees.
# No secrets, no deploy. Pure static checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check links in Markdown
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check.json'

  house-style:
    name: House style (no em-dashes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail on em-dash characters
        run: |
          # The em-dash (U+2014) is a hard house-rule violation. Grep for it
          # across the files a reader sees and fail if any are found.
          if grep -rnP "\x{2014}" --exclude-dir=.git \
              --include='*.md' --include='*.js' --include='*.json' \
              --include='*.yml' --include='*.cff' .; then
            echo "::error::Found em-dash characters (U+2014). Use a comma or a spaced hyphen instead."
            exit 1
          fi
          echo "No em-dashes found. Good."
